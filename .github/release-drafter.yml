name-template: 'v$RESOLVED_VERSION 🌈'
tag-template: 'v$RESOLVED_VERSION'
replacers:
  - search: '/CVE-(\d{4})-(\d+)/g'
    replace: 'https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-$1-$2'
categories:
  - type: "pre-exclude"
    when:
      label: "skip-changelog"
  - title: '💥 BREAKING CHANGES'
    when:
      labels:
        - 'breaking'
  - title: '🚀 Features'
    when:
      labels:
        - 'feature'
        - 'enhancement'
  - title: '🐛 Bug Fixes'
    when:
      labels:
        - 'fix'
        - 'bugfix'
        - 'bug'
  - title: '🧰 Maintenance'
    when:
      labels:
        - 'chore'
        - 'documentation'
        - 'ci'
        - 'refactor'
        - 'style'
        - 'test'
        - 'revert'
        # Dependabot sets this next to the chore label of its title: same category, listed once
        - 'dependencies'
  - title: '🔒 Security'
    when:
      labels:
        - 'security'
  - type: version-resolver
    semver-increment: major
    when:
      labels:
        - 'major'
        - 'breaking'
  - type: version-resolver
    semver-increment: minor
    when:
      labels:
        - 'patch'
        - 'documentation'
        - 'ci'
        - 'style'
        - 'test'
  - type: version-resolver
    semver-increment: minor
    when:
      labels:
        - 'minor'
        - 'refactor'
  - type: version-resolver
    semver-increment: patch
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&' # You can add # and @ to disable mentions, and add ` to disable code blocks.
# Labels only from the conventional prefix in the title (enforced by pr-title-checker), so a PR
# gets one category. Matching on files gave e.g. a fix that also changes docs three labels, and
# release-drafter lists a PR once for every category it matches.
autolabeler:
  - label: 'breaking'
    title:
      - '/!:/'
    body:
      - '/BREAKING CHANGE/'
  - label: 'chore'
    title:
      - '/^chore(\([a-z]*\))?!?:/i'
  - label: 'ci'
    title:
      - '/^(ci|build)(\([a-z]*\))?!?:/i'
  - label: 'documentation'
    title:
      - '/^docs(\([a-z]*\))?!?:/i'
  - label: 'enhancement'
    title:
      - '/^(feat|perf)(\([a-z]*\))?!?:/i'
  - label: 'bug'
    title:
      - '/^(fix|hotfix|bug)(\([a-z]*\))?!?:/i'
  - label: 'refactor'
    title:
      - '/^refactor(\([a-z]*\))?!?:/i'
  - label: 'revert'
    title:
      - '/^revert(\([a-z]*\))?!?:/i'
  - label: 'style'
    title:
      - '/^style(\([a-z]*\))?!?:/i'
  - label: 'test'
    title:
      - '/^test(\([a-z]*\))?!?:/i'
template: |
  ## Changes

  $CHANGES
